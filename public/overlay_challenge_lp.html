<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Overlay Challenge — Barre LP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:        #2F8FFF;
    --red:         #E0263F;
    --red-bright:  #FF5A6E;
    --violet:      #8A3AE0;
    --violet-bright: #B57BFF;
    --text:        #FFFFFF;
    --ink-glass:   rgba(28, 8, 14, 0.72);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 400px;
    height: 940px;
    background: transparent;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
  }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 0 26px;
  }

  .track-wrap {
    position: relative;
    flex: 1;
    width: 34px;
    display: flex;
    justify-content: center;
  }

  .track {
    position: relative;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid color-mix(in srgb, var(--red) 45%, transparent);
    overflow: visible;
  }

  .fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: linear-gradient(0deg, var(--violet) 0%, var(--red) 100%);
    box-shadow: 0 0 16px color-mix(in srgb, var(--red) 55%, transparent);
    transition: height 900ms cubic-bezier(.2,.8,.2,1);
  }

  .marker {
    position: absolute;
    left: 50%;
    bottom: 0%;
    width: 54px;
    height: 4px;
    transform: translate(-50%, 50%);
    background: var(--blue);
    box-shadow: 0 0 10px 3px color-mix(in srgb, var(--blue) 80%, transparent);
    transition: bottom 900ms cubic-bezier(.2,.8,.2,1);
  }
  .marker::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 12px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: var(--blue);
    box-shadow: 0 0 14px 4px color-mix(in srgb, var(--red-bright) 75%, transparent);
    animation: marker-pulse 1.8s ease-in-out infinite;
  }
  @keyframes marker-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .55; }
  }

  .ticks { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .tick {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    transform: translateY(50%);
  }
  /* Marqueur confine a la largeur de la barre (34px) pour signaler le palier sans deborder par-dessus le texte. */
  .tick-bar {
    position: absolute;
    left: 50%;
    top: 0;
    width: 100%;
    height: 3px;
    transform: translate(-50%, -50%);
    background: var(--violet-bright);
    opacity: .85;
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 0 6px color-mix(in srgb, var(--violet-bright) 70%, transparent);
  }
  .tick.reached .tick-bar {
    background: #ffffff;
    opacity: 1;
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 0 8px 2px rgba(255,255,255,.85);
  }
  /* Rang + LP vise, affiche a droite de la barre : chip glass avec rang (violet) et LP (rouge) distincts. */
  .tick-lp {
    position: absolute;
    left: 100%;
    top: 0;
    transform: translate(10px, -50%);
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .3px;
    white-space: nowrap;
    background: var(--ink-glass);
    border: 1px solid color-mix(in srgb, var(--violet-bright) 45%, transparent);
    padding: 3px 8px;
    border-radius: 3px;
    box-shadow: 0 0 4px rgba(0,0,0,.5);
  }
  .tick-lp-rank {
    color: var(--violet-bright);
    text-transform: uppercase;
  }
  .tick-lp-sep {
    color: rgba(255,255,255,.3);
  }
  .tick-lp-lp {
    color: var(--red-bright);
  }
  .tick.reached .tick-lp {
    border-color: var(--red-bright);
    box-shadow: 0 0 4px rgba(0,0,0,.5), 0 0 8px color-mix(in srgb, var(--red-bright) 50%, transparent);
  }
  .tick.reached .tick-lp-rank,
  .tick.reached .tick-lp-lp {
    text-shadow: 0 0 6px currentColor;
  }
  /* Libelle personnalise du palier (objectif, optionnel), affiche a gauche de la barre. */
  .tick-label {
    position: absolute;
    right: 100%;
    top: 0;
    transform: translate(-10px, -50%);
    width: 130px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: normal;
    text-align: right;
    line-height: 1.15;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 1px 4px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.6);
    opacity: .7;
  }
  .tick.reached .tick-label { opacity: 1; text-shadow: 0 0 6px rgba(255,255,255,.8); }

  .empty-hint {
    display: none;
    font-size: 11px;
    color: var(--text);
    opacity: .55;
    text-align: center;
    padding: 0 10px 12px;
    line-height: 1.5;
  }

  /* ---- Celebration on milestone reached ---- */
  .celebrate-banner {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform: translate(-50%, 50%) scale(.7);
    background: linear-gradient(120deg, var(--violet) 0%, var(--red) 100%);
    border: 1px solid var(--violet-bright);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    padding: 8px 18px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    box-shadow: 0 0 26px color-mix(in srgb, var(--red) 80%, transparent);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
  .celebrate-banner.show {
    animation:
      banner-in   500ms cubic-bezier(.2,.9,.3,1.4) forwards,
      banner-hold 2600ms linear forwards 500ms,
      banner-out  500ms ease-in forwards 3100ms;
  }
  @keyframes banner-in   { from { opacity: 0; transform: translate(-50%, 50%) scale(.5); } to { opacity: 1; transform: translate(-50%, 50%) scale(1); } }
  @keyframes banner-hold { from { opacity: 1; } to { opacity: 1; } }
  @keyframes banner-out  { to   { opacity: 0; transform: translate(-50%, 30%) scale(.85); } }

  .confetti {
    position: absolute;
    left: 0; right: 0; bottom: 0; height: 0;
    pointer-events: none;
    z-index: 15;
    overflow: visible;
  }
  .confetti span {
    position: absolute;
    bottom: 0;
    width: 6px; height: 12px;
    opacity: 0;
  }
  .confetti.show span { animation: confetti-burst 1200ms ease-out forwards; }
  @keyframes confetti-burst {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-160px) rotate(300deg); }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="empty-hint" id="emptyHint"></div>

    <div class="track-wrap">
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="marker" id="marker"></div>
      </div>
      <div class="ticks" id="ticks"></div>
      <div class="celebrate-banner" id="celebrateBanner"></div>
      <div class="confetti" id="confetti"></div>
    </div>
  </div>

<script>
  // ---- Doit rester identique a rankValue() dans server.js ----
  const RIOT_TIERS      = ["IRON", "BRONZE", "SILVER", "GOLD", "PLATINUM", "EMERALD", "DIAMOND", "MASTER", "GRANDMASTER", "CHALLENGER"];
  const RIOT_DIVISIONS  = ["IV", "III", "II", "I"];
  const RIOT_APEX_TIERS = new Set(["MASTER", "GRANDMASTER", "CHALLENGER"]);
  const TIER_FR = {
    IRON: "Fer", BRONZE: "Bronze", SILVER: "Argent", GOLD: "Or", PLATINUM: "Platine",
    EMERALD: "Émeraude", DIAMOND: "Diamant", MASTER: "Maître", GRANDMASTER: "Grand Maître", CHALLENGER: "Challenger",
  };

  function rankValue(tier, division, lp) {
    const t         = (tier || "").toUpperCase();
    const tierIndex = RIOT_TIERS.indexOf(t);
    if (tierIndex === -1) return 0;
    if (RIOT_APEX_TIERS.has(t)) return RIOT_TIERS.indexOf("MASTER") * 400 + (lp || 0);
    const divIndex = Math.max(0, RIOT_DIVISIONS.indexOf((division || "IV").toUpperCase()));
    return tierIndex * 400 + divIndex * 100 + (lp || 0);
  }

  function tierLabel(tier, division) {
    const t = (tier || "").toUpperCase();
    if (!t) return "";
    return RIOT_APEX_TIERS.has(t) ? (TIER_FR[t] || t) : `${TIER_FR[t] || t} ${division || ""}`.trim();
  }

  function milestoneTarget(m) {
    return `<span class="tick-lp-rank">${tierLabel(m.tier, m.division)}</span><span class="tick-lp-sep">·</span><span class="tick-lp-lp">${m.lp || 0} LP</span>`;
  }

  const emptyHintEl       = document.getElementById('emptyHint');
  const fillEl            = document.getElementById('fill');
  const markerEl          = document.getElementById('marker');
  const ticksEl            = document.getElementById('ticks');
  const celebrateBannerEl = document.getElementById('celebrateBanner');
  const confettiEl        = document.getElementById('confetti');

  let lastMilestones = [];

  function renderTicks(milestones, minV, maxV) {
    ticksEl.innerHTML = '';
    milestones.forEach((m) => {
      const v   = rankValue(m.tier, m.division, m.lp);
      const pct = Math.min(100, Math.max(0, ((v - minV) / (maxV - minV)) * 100));
      const tick = document.createElement('div');
      tick.className = 'tick' + (m.reachedAt ? ' reached' : '');
      tick.style.bottom = pct + '%';
      const labelHtml = m.label ? `<span class="tick-label">${m.label}</span>` : '';
      tick.innerHTML = `<span class="tick-bar"></span><span class="tick-lp">${milestoneTarget(m)}</span>${labelHtml}`;
      ticksEl.appendChild(tick);
    });
  }

  function applyRiotState(s) {
    const milestones = (s.milestones || []).slice().sort((a, b) => rankValue(a.tier, a.division, a.lp) - rankValue(b.tier, b.division, b.lp));
    lastMilestones = milestones;

    if (milestones.length < 2) {
      emptyHintEl.textContent   = 'Configurez au moins 2 paliers dans l\'admin';
      emptyHintEl.style.display = 'block';
      fillEl.style.height       = '0%';
      markerEl.style.bottom     = '0%';
      ticksEl.innerHTML         = '';
      return;
    }

    const first = milestones[0];
    const last  = milestones[milestones.length - 1];
    const minV  = rankValue(first.tier, first.division, first.lp);
    const maxV  = rankValue(last.tier, last.division, last.lp);

    renderTicks(milestones, minV, maxV);

    if (s.currentRank) {
      emptyHintEl.style.display = 'none';
      const value = rankValue(s.currentRank.tier, s.currentRank.division, s.currentRank.lp);
      const pct   = Math.min(100, Math.max(0, ((value - minV) / (maxV - minV)) * 100));
      fillEl.style.height   = pct + '%';
      markerEl.style.bottom = pct + '%';
    } else {
      emptyHintEl.textContent   = 'En attente du premier sondage Riot…';
      emptyHintEl.style.display = 'block';
      fillEl.style.height       = '0%';
      markerEl.style.bottom     = '0%';
    }
  }

  function fireConfetti() {
    const colors = ['var(--red)', 'var(--red-bright)', 'var(--violet)', 'var(--violet-bright)'];
    confettiEl.innerHTML = '';
    confettiEl.classList.remove('show');

    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.style.left           = (30 + Math.random() * 40) + '%';
      s.style.background     = colors[Math.floor(Math.random() * colors.length)];
      s.style.animationDelay = (Math.random() * 200) + 'ms';
      s.style.transform      = `rotate(${Math.random() * 360}deg)`;
      confettiEl.appendChild(s);
    }
    void confettiEl.offsetWidth;
    confettiEl.classList.add('show');
  }

  function celebrateMilestone(milestone) {
    celebrateBannerEl.textContent = (milestone.label || tierLabel(milestone.tier, milestone.division)) + ' atteint !';

    if (lastMilestones.length >= 2) {
      const minV = rankValue(lastMilestones[0].tier, lastMilestones[0].division, lastMilestones[0].lp);
      const maxV = rankValue(lastMilestones[lastMilestones.length - 1].tier, lastMilestones[lastMilestones.length - 1].division, lastMilestones[lastMilestones.length - 1].lp);
      const v    = rankValue(milestone.tier, milestone.division, milestone.lp);
      const pct  = Math.min(100, Math.max(0, ((v - minV) / (maxV - minV)) * 100));
      celebrateBannerEl.style.bottom = pct + '%';
      confettiEl.style.bottom        = pct + '%';
    }

    celebrateBannerEl.classList.remove('show');
    void celebrateBannerEl.offsetWidth;
    celebrateBannerEl.classList.add('show');
    fireConfetti();
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws    = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'riotState')     applyRiotState(msg);
      if (msg.type === 'riotMilestone') celebrateMilestone(msg.milestone);
    };

    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
