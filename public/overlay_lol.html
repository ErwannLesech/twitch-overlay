<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Overlay League of Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:         #E0263F;
    --red-bright:  #FF5A6E;
    --violet:      #8A3AE0;
    --violet-bright: #B57BFF;
    --text:        #FFFFFF;
    --chip-bg:     rgba(14, 6, 10, 0.62);
    --chip-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 530px;
    height: 150px;
    background: transparent;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
  }

  .widget {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 8px;
  }

  .chip {
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    backdrop-filter: blur(3px);
  }

  /* ---- Profile row ---- */
  .profile-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .avatar-ring {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    padding: 2.5px;
    background: var(--tier-color, #55504a);
    box-shadow: 0 0 10px var(--tier-glow, transparent);
    transition: background 400ms ease, box-shadow 400ms ease;
  }
  .avatar-ring img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #1a1015;
    visibility: hidden;
  }

  .profile-text {
    flex: 0 1 auto;
    min-width: 0;
  }
  .handle {
    display: flex;
    align-items: baseline;
    gap: 3px;
    line-height: 1.1;
  }
  .handle-name {
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
    text-shadow: 0 0 6px rgba(255,255,255,.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }
  .handle-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    opacity: .55;
  }
  .rank-line {
    margin-top: 2px;
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .4px;
  }
  .rank-name { color: var(--violet-bright); text-transform: uppercase; }
  .rank-lp   { color: var(--red-bright); opacity: .9; }
  .ladder-rank {
    color: var(--red-bright);
    font-family: 'Cinzel', serif;
    font-size: 10.5px;
    opacity: .9;
  }

  .ratio-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    min-width: 0;
  }

  /* Global (challenge complet) — bloc central, mis en avant */
  .ratio-global {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding-left: 10px;
    border-left: 1px solid var(--chip-border);
  }
  .ratio-global-score {
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
    text-shadow: 0 0 6px rgba(255,255,255,.55);
    white-space: nowrap;
  }
  .ratio-global-pct {
    font-size: 12px;
    font-weight: 700;
    color: var(--red-bright);
    letter-spacing: .5px;
  }

  /* Session (depuis le lancement du serveur) — bloc secondaire, tout a droite */
  .ratio-session {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding-left: 10px;
    border-left: 1px solid var(--chip-border);
  }
  .ratio-session-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--violet-bright);
    opacity: .8;
  }
  .ratio-session-score {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-shadow: 0 0 6px rgba(255,255,255,.55);
    white-space: nowrap;
  }

  .ratio-wrap.bump { animation: bump 420ms ease-out; }
  @keyframes bump {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ---- Thin ratio track ---- */
  .ratio-track {
    height: 4px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
    border-radius: 2px;
  }
  .ratio-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--violet), var(--red));
    transition: width 900ms cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 0 8px color-mix(in srgb, var(--red) 55%, transparent);
  }

  /* ---- Match history strip ---- */
  .matches-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 6px 8px;
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
  }

  .match-tile {
    position: relative;
    width: 32px;
    display: flex;
    flex-direction: column;
    border-radius: 5px;
    overflow: hidden;
    border: 1.5px solid var(--tile-border, rgba(255,255,255,.12));
    box-shadow: 0 0 5px var(--tile-glow, transparent);
    background: rgba(255,255,255,.04);
  }
  .match-tile img {
    width: 100%;
    height: 32px;
    object-fit: cover;
    display: block;
  }
  .match-tile .kda {
    font-size: 8px;
    line-height: 11px;
    font-weight: 700;
    text-align: center;
    color: #000;
    background: var(--tile-border, transparent);
    white-space: nowrap;
  }
  .match-tile.win  { --tile-border: var(--violet-bright); --tile-glow: color-mix(in srgb, var(--violet) 60%, transparent); }
  .match-tile.loss { --tile-border: var(--red-bright);    --tile-glow: color-mix(in srgb, var(--red) 60%, transparent); }
  .match-tile.empty { opacity: .3; border-style: dashed; height: 43px; }

  .match-tile.enter { animation: tile-in 380ms cubic-bezier(.2,.9,.3,1.2); }
  @keyframes tile-in {
    0%   { transform: scale(.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

  <div class="widget">
    <div class="chip profile-chip">
      <div class="avatar-ring" id="avatarRing">
        <img id="avatarImg" alt="" />
      </div>
      <div class="profile-text">
        <div class="handle">
          <span class="handle-name" id="handleName">—</span><span class="handle-tag" id="handleTag"></span>
        </div>
        <div class="rank-line">
          <span class="rank-name" id="rankName">Challenge en attente</span>
          <span class="rank-lp" id="rankLp"></span>
          <span class="ladder-rank" id="ladderRank"></span>
        </div>
      </div>
      <div class="ratio-wrap" id="ratioPill">
        <div class="ratio-global">
          <span class="ratio-global-score" id="ratioScore">0V – 0D</span>
          <span class="ratio-global-pct" id="ratioPct">—</span>
        </div>
        <div class="ratio-session">
          <span class="ratio-session-label">Session</span>
          <span class="ratio-session-score" id="sessionScore">0V – 0D</span>
        </div>
      </div>
    </div>

    <div class="ratio-track"><div class="ratio-fill" id="ratioFill"></div></div>

    <div class="chip matches-chip" id="matchesRow"></div>
  </div>

<script>
  const TIER_FR = {
    IRON: "Fer", BRONZE: "Bronze", SILVER: "Argent", GOLD: "Or", PLATINUM: "Platine",
    EMERALD: "Émeraude", DIAMOND: "Diamant", MASTER: "Maître", GRANDMASTER: "Grand Maître", CHALLENGER: "Challenger",
  };
  const APEX_TIERS = new Set(["MASTER", "GRANDMASTER", "CHALLENGER"]);

  // Couleur du cadre de l'avatar selon le rang courant.
  const TIER_STYLE = {
    IRON:        { ring: "#6b645c", glow: "rgba(107,100,92,.55)" },
    BRONZE:      { ring: "#a9683f", glow: "rgba(169,104,63,.55)" },
    SILVER:      { ring: "#b9c8d6", glow: "rgba(185,200,214,.55)" },
    GOLD:        { ring: "#C89B3C", glow: "rgba(200,155,60,.6)" },
    PLATINUM:    { ring: "#3ecf9e", glow: "rgba(62,207,158,.55)" },
    EMERALD:     { ring: "#17c964", glow: "rgba(23,201,100,.55)" },
    DIAMOND:     { ring: "#4fc3f7", glow: "rgba(79,195,247,.6)" },
    MASTER:      { ring: "linear-gradient(135deg,#B57BFF,#FF5A6E)",        glow: "rgba(181,123,255,.65)" },
    GRANDMASTER: { ring: "linear-gradient(135deg,#FF5A6E,#B57BFF)",        glow: "rgba(255,90,110,.65)" },
    CHALLENGER:  { ring: "linear-gradient(135deg,#B57BFF,#F0E6D2,#FF5A6E)", glow: "rgba(240,230,210,.7)" },
  };
  const DEFAULT_TIER_STYLE = { ring: "#55504a", glow: "transparent" };

  function tierLabel(tier, division) {
    const t = (tier || "").toUpperCase();
    if (!t) return "";
    return APEX_TIERS.has(t) ? (TIER_FR[t] || t) : `${TIER_FR[t] || t} ${division || ""}`.trim();
  }

  const avatarRingEl  = document.getElementById('avatarRing');
  const avatarImgEl   = document.getElementById('avatarImg');
  const handleNameEl  = document.getElementById('handleName');
  const handleTagEl   = document.getElementById('handleTag');
  const rankNameEl    = document.getElementById('rankName');
  const rankLpEl       = document.getElementById('rankLp');
  const ladderRankEl  = document.getElementById('ladderRank');
  const ratioPillEl   = document.getElementById('ratioPill');
  const ratioScoreEl  = document.getElementById('ratioScore');
  const ratioPctEl    = document.getElementById('ratioPct');
  const sessionScoreEl = document.getElementById('sessionScore');
  const ratioFillEl   = document.getElementById('ratioFill');
  const matchesRowEl  = document.getElementById('matchesRow');

  function renderMatches(matches, version) {
    const capped = (matches || []).slice(0, 10); // deja triees plus recente -> plus ancienne
    const padded = capped.concat(Array(Math.max(0, 10 - capped.length)).fill(null)); // gauche -> droite = recente -> ancienne

    matchesRowEl.innerHTML = '';
    padded.forEach((m) => {
      const tile = document.createElement('div');
      if (m) {
        tile.className = 'match-tile ' + (m.win ? 'win' : 'loss');
        tile.title = `${m.championName}${m.win ? ' — Victoire' : ' — Défaite'}`;
        if (version && m.championName) {
          const img = document.createElement('img');
          img.src = `https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${m.championName}.png`;
          img.alt = m.championName;
          tile.appendChild(img);
        }
        if (m.kills != null && m.deaths != null && m.assists != null) {
          const kda = document.createElement('div');
          kda.className = 'kda';
          kda.textContent = `${m.kills}/${m.deaths}/${m.assists}`;
          tile.appendChild(kda);
        }
      } else {
        tile.className = 'match-tile empty';
      }
      matchesRowEl.appendChild(tile);
    });
  }

  function applyRiotState(s) {
    if (s.ddragonVersion && s.profileIconId != null) {
      avatarImgEl.src              = `https://ddragon.leagueoflegends.com/cdn/${s.ddragonVersion}/img/profileicon/${s.profileIconId}.png`;
      avatarImgEl.style.visibility = 'visible';
    } else {
      avatarImgEl.style.visibility = 'hidden';
    }

    const tierStyle = TIER_STYLE[(s.currentRank?.tier || '').toUpperCase()] || DEFAULT_TIER_STYLE;
    avatarRingEl.style.setProperty('--tier-color', tierStyle.ring);
    avatarRingEl.style.setProperty('--tier-glow', tierStyle.glow);

    handleNameEl.textContent = s.displayName?.gameName || '—';
    handleTagEl.textContent  = s.displayName?.tagLine ? '#' + s.displayName.tagLine : '';

    if (s.currentRank) {
      rankNameEl.textContent      = tierLabel(s.currentRank.tier, s.currentRank.division);
      rankLpEl.textContent         = `${s.currentRank.lp} LP`;
      ladderRankEl.textContent    = s.ladderRank ? `#${s.ladderRank}` : '';
      ladderRankEl.style.display  = s.ladderRank ? '' : 'none';
    } else {
      rankNameEl.textContent     = 'Challenge en attente';
      rankLpEl.textContent        = '';
      ladderRankEl.style.display = 'none';
    }

    const wins = s.wins ?? 0, losses = s.losses ?? 0, total = wins + losses;
    const pct  = total > 0 ? Math.round((wins / total) * 100) : 0;
    ratioScoreEl.textContent = `${wins}V – ${losses}D`;
    ratioPctEl.textContent   = total > 0 ? `${pct}%` : '—';
    ratioFillEl.style.width  = pct + '%';

    const sessionWins = s.sessionWins ?? 0, sessionLosses = s.sessionLosses ?? 0;
    sessionScoreEl.textContent = `${sessionWins}V – ${sessionLosses}D`;

    renderMatches(s.recentMatches, s.ddragonVersion);
  }

  function bump(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws    = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'riotState') applyRiotState(msg);
      if (msg.type === 'riotMatch') bump(ratioPillEl);
    };

    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
